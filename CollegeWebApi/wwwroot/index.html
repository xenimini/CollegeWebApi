<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CollegeDB</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #1e1e1e;
            color: #eee;
        }

        h1 {
            color: #4ec9b0;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background: #1177bb;
            }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #252526;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>CollegeDB — Студенты и группы</h1>
    <button onclick="loadStudents()">Показать всех студентов</button>
    <button onclick="loadGroups()">Показать все группы</button>
    <h3>Создать студента</h3>
    <input id="firstName" placeholder="Имя">
    <input id="lastName" placeholder="Фамилия">
    <input id="age" type="number" placeholder="Возраст">
    <input id="groupId" type="number" placeholder="GroupId">
    <button onclick="createStudent()">Создать</button>

    <h3>Обновить студента</h3>
    <input id="editId" type="number" placeholder="Id">
    <input id="editFirstName" placeholder="Имя">
    <input id="editLastName" placeholder="Фамилия">
    <input id="editAge" type="number" placeholder="Возраст">
    <input id="editGroupId" type="number" placeholder="GroupId">
    <button onclick="updateStudent()">Обновить</button>

    <h3>Удалить студента</h3>
    <input id="deleteId" type="number" placeholder="Id">
    <button onclick="deleteStudent()">Удалить</button>

    <br><br>
    <button onclick="loadStudents()">Показать всех</button>
    <div id="result">Нажми кнопку...</div>
    <button onclick="loadAll()">students/all</button>
    <input type="number" id="studentId" placeholder="ID студента" style="padding:8px;">
    <button onclick="loadById()">student/id</button>
    <script>
        async function loadStudents() {
            const response = await fetch('/api/Students');
            const data = await response.json();
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        }

        async function createStudent() {
            const student = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                age: parseInt(document.getElementById('age').value),
                groupId: parseInt(document.getElementById('groupId').value) || null
            };

            const response = await fetch('/api/Students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });
            const result = await response.json();
            alert('Создан студент с Id = ' + result.id);
            loadStudents();
        }

        async function updateStudent() {
            const id = document.getElementById('editId').value;
            const student = {
                firstName: document.getElementById('editFirstName').value,
                lastName: document.getElementById('editLastName').value,
                age: parseInt(document.getElementById('editAge').value),
                groupId: parseInt(document.getElementById('editGroupId').value) || null
            };

            await fetch(`/api/Students/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            });
            alert('Обновлено');
            loadStudents();
        }

        async function deleteStudent() {
            const id = document.getElementById('deleteId').value;
            if (!confirm('Удалить студента ' + id + '?')) return;

            await fetch(`/api/Students/${id}`, { method: 'DELETE' });
            alert('Удалено');
            loadStudents();
        }
    </script>
</body>
</html>
